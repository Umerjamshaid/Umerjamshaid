  #   permissions:
  #     contents: write
  #   steps:
  #     - uses: lowlighter/metrics@v3.34
  #       with:
  #         token: ${{ secrets.METRICS_TOKEN }}
  #         user: Umerjamshaid
  #         template: classic
  #         base: ""
  #         filename: metrics-steam.svg
  #         plugin_steam: yes
  #         plugin_steam_token: ${{ secrets.STEAM_API_KEY }}
  #         plugin_steam_user: "YOUR_STEAM_ID"  # ← Replace with your Steam ID
  #         plugin_steam_sections: player, most-played, recently-played
