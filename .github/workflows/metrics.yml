name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - README.md
      - .github/workflows/metrics.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      metrics-enabled: ${{ steps.secrets.outputs.metrics }}
      wakatime-enabled: ${{ steps.secrets.outputs.wakatime }}
    steps:
      - name: Check widget credentials
        id: secrets
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "metrics=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add METRICS_TOKEN to enable GitHub profile metrics. WakaTime can still update independently."
          else
            echo "metrics=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WAKATIME_API_KEY" ]; then
            echo "wakatime=true" >> "$GITHUB_OUTPUT"
          else
            echo "wakatime=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add WAKATIME_API_KEY to enable the WakaTime card. Other widgets will still update."
          fi

  # ──────────────────────────────────────────────
  # 1. Header + Base Stats
  # ──────────────────────────────────────────────
  header:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          filename: github-metrics.svg

  # ──────────────────────────────────────────────
  # 2. Isometric Commit Calendar (3D)
  # ──────────────────────────────────────────────
  isocalendar:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ──────────────────────────────────────────────
  # 3. Achievements
  # ──────────────────────────────────────────────
  achievements:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-achievements.svg
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C

  # ──────────────────────────────────────────────
  # 4. Languages (detailed breakdown)
  # ──────────────────────────────────────────────
  languages:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-languages.svg
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

  # ──────────────────────────────────────────────
  # 5. Coding Habits (wake time / active hours)
  # ──────────────────────────────────────────────
  habits:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-habits.svg
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes

  # ──────────────────────────────────────────────
  # 6. Notable Contributions
  # ──────────────────────────────────────────────
  notable:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-notable.svg
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue

  # ──────────────────────────────────────────────
  # 7. WakaTime (coding stats)
  # ──────────────────────────────────────────────
  wakatime:
    if: needs.setup.outputs.wakatime-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: NOT_NEEDED
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-wakatime.svg
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_limit: 5
          plugin_wakatime_sections: time, projects, languages, editors, os
          plugin_wakatime_languages_other: yes
          plugin_wakatime_repositories_visibility: all

  # ──────────────────────────────────────────────
  # 8. Lines of Code Changed
  # ──────────────────────────────────────────────
  lines:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: repositories
          config_timezone: Asia/Karachi
          filename: metrics-lines.svg
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

  # ──────────────────────────────────────────────
  # 9. Stars & Stargazers
  # ──────────────────────────────────────────────
  stars:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-stargazers.svg
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic

  # ──────────────────────────────────────────────
  # 10. Follow-up (Issues & PRs status)
  # ──────────────────────────────────────────────
  followup:
    if: needs.setup.outputs.metrics-enabled == 'true'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Umerjamshaid
          template: classic
          plugins_errors_fatal: yes
          committer_branch: main
          base: ""
          config_timezone: Asia/Karachi
          filename: metrics-followup.svg
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories

  # ──────────────────────────────────────────────
  # 11. Steam (gaming profile)
