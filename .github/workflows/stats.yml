name: GitHub stats card

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Umerjamshaid&show_icons=true&theme=dracula&hide_border=true
          path: github-stats.svg
          token: ${{ github.token }}
          fail_on_error: "true"
      - name: Publish stats image
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'github-stats.svg';
            const content = fs.readFileSync(path).toString('base64');
            let sha;
            try {
              const {data} = await github.rest.repos.getContent({...context.repo, path, ref: 'main'});
              sha = data.sha;
              if (data.content.replace(/\s/g, '') === content) return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, content, sha, branch: 'main',
              message: 'Update GitHub stats card'
            });
